aid: array-us
name: Array US
description: >-
  Array US (Array) is a New York-based embedded finance and fintech
  infrastructure company. Array provides white-label, embeddable consumer
  credit, identity, and financial data products that banks, credit unions,
  fintechs, and consumer brands integrate into their own apps and marketing
  funnels through Array's developer tools, embeddable components, and APIs.
  Its product catalog includes credit score monitoring (My Credit Manager),
  identity and privacy protection, credit building (BuildCredit account and
  rent reporting), background checks, debt management and navigation,
  subscription management, property and home-value data, financial calculators,
  student loan aid, and a personalized Offers Engine and marketplace. Array is
  backed by Battery Ventures among other venture investors and was surfaced in
  the API Evangelist network as a Battery Ventures portfolio company.
